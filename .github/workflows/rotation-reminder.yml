name: rotation-reminder
on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check last rotation date
        run: |
          if ! grep -q "Last rotation:" docs/rotation-runbook.md 2>/dev/null; then
            echo "::warning::Rotation runbook has no recorded last-rotation date"
          fi
