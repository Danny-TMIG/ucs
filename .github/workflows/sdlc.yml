name: sdlc
on:
  pull_request: {branches: [main]}
  push: {branches: [main]}
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: sdlc gate
        run: |
          set -euo pipefail
          source tools/sdlc.sh
          sdlc_init
          sdlc_gate
