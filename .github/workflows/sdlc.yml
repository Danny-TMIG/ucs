name: sdlc
on:
  pull_request: {branches: [main]}
  push: {branches: [main]}
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: content checks
        run: python3 ci/content-checks.py
      - name: arch check
        run: python3 ci/arch-check.py
      - name: correlate
        run: python3 ci/correlate.py
      - name: parallel self-tests
        run: python3 spec/parallel_check.py
