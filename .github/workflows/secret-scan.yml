name: secret-scan
on:
  pull_request:
  push:
    branches: [main]
jobs:
  block-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail on KEY or .sig anywhere in tree
        run: |
          if git ls-files | grep -E "(^|/)KEY$|\.sig$|^archives/"; then
            echo "BLOCKED: signing material in tree"
            git ls-files | grep -E "(^|/)KEY$|\.sig$|^archives/"
            exit 1
          fi
          echo "tree clean"
